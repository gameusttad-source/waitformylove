<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Saima 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Quicksand',sans-serif;
background:linear-gradient(45deg,#ff6ec4,#7873f5);
color:white;
overflow-x:hidden;
transition:0.5s;
}

/* HEADER */
.header{
text-align:center;
padding:70px 20px;
}
h1{
font-family:'Great Vibes',cursive;
font-size:3rem;
}

/* CARDS */
.card{
background:rgba(255,255,255,0.15);
margin:20px;
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
}

/* BUTTON */
.btn{
padding:15px 30px;
border:none;
border-radius:30px;
background:#ff006e;
color:white;
font-size:16px;
}

/* GUIDE */
.guide{
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
background:black;
padding:10px 20px;
border-radius:20px;
font-size:14px;
z-index:999;
}

.next{
position:fixed;
bottom:20px;
right:20px;
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff006e;
color:white;
}

/* HIGHLIGHT */
.highlight{
box-shadow:0 0 25px white;
}

/* GALLERY */
.gallery{
display:flex;
overflow-x:auto;
gap:10px;
}
.gallery img{
width:200px;
border-radius:15px;
}

/* SECRET */
.secret{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
z-index:99999;
animation:fadeIn 1s;
}

.secret h2{
font-family:'Great Vibes';
font-size:2.5rem;
color:#ff6ec4;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}
</style>
</head>

<body>

<div class="header">
<h1>For My Saima 💕</h1>
<p>You are my everything</p>
</div>

<div class="card" id="typingCard">
<p id="typing"></p>
</div>

<div class="card">
<button class="btn" onclick="playVoice()">▶ Play My Voice</button>
<audio id="audio" src="your-audio.mp3"></audio>
</div>

<div class="card">
<div class="gallery">
<img src="https://picsum.photos/200?1">
<img src="https://picsum.photos/200?2">
<img src="https://picsum.photos/200?3">
</div>
</div>

<div class="card">
<button class="btn" onclick="reveal()">Reveal Surprise 💕</button>
<p id="hidden" style="display:none;">I just want to hold you forever ❤️</p>
</div>

<div class="card">
<button class="btn" onclick="spin()">Spin 🎡</button>
<p id="spinResult"></p>
</div>

<div class="card">
<button class="btn" onclick="love()">Send Love 💖</button>
<p id="count">0</p>
</div>

<button class="next" onclick="nextStep()">Next ➜</button>
<div class="guide" id="guide">Start journey 💕</div>

<!-- SECRET END -->
<div class="secret" id="secret">
<h2>💖 My Secret For You 💖</h2>
<p>I waited for you... I still do...<br>
You are not just special... you are everything to me 💕</p>
<button class="btn" onclick="closeSecret()">Close</button>
</div>

<script>

// TYPING
let msg="Since morning I am waiting for you... I just want to talk to you 💕";
let i=0;
function type(){
if(i<msg.length){
document.getElementById("typing").innerHTML+=msg.charAt(i);
i++;
setTimeout(type,50);
}
}
type();

// VOICE
function playVoice(){
document.getElementById("audio").play();
}

// REVEAL
function reveal(){
document.getElementById("hidden").style.display="block";
nextStep();
}

// SPIN
let opts=["Hug 🤗","Kiss 😘","Smile 😊","Love 💕"];
function spin(){
let r=opts[Math.floor(Math.random()*opts.length)];
document.getElementById("spinResult").innerText=r;
nextStep();
}

// LOVE
let c=0;
function love(){
c++;
document.getElementById("count").innerText=c+" loves 💕";
}

// GUIDE
let steps=[
"Read my message 💌",
"Play my voice 🎧",
"See memories 🖼️",
"Reveal surprise 💕",
"Spin wheel 🎡",
"Send love 💖"
];

let step=0;

function nextStep(){
if(step<steps.length){
document.getElementById("guide").innerText=steps[step];
highlight(step);
step++;
}else{
unlockSecret();
}
}

function highlight(i){
document.querySelectorAll(".card").forEach(e=>e.classList.remove("highlight"));
document.querySelectorAll(".card")[i].classList.add("highlight");
document.querySelectorAll(".card")[i].scrollIntoView({behavior:"smooth"});
}

// SECRET UNLOCK
function unlockSecret(){
document.getElementById("guide").innerText="Secret unlocked 💖";
setTimeout(()=>{
document.getElementById("secret").style.display="flex";
confetti();
},1000);
}

function closeSecret(){
document.getElementById("secret").style.display="none";
}

// CONFETTI
function confetti(){
for(let i=0;i<60;i++){
let d=document.createElement("div");
d.style.position="fixed";
d.style.width="8px";
d.style.height="8px";
d.style.background="white";
d.style.top="0";
d.style.left=Math.random()*100+"%";
document.body.appendChild(d);

setTimeout(()=>{
d.style.top="100%";
},100);

setTimeout(()=>d.remove(),2000);
}
}

</script>

</body>
</html>
