<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Saima 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&family=Sacramento&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===== YOUR ORIGINAL CSS (UNCHANGED) ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

:root {
    --hot-pink: #ff006e;
    --purple: #8338ec;
    --orange: #fb5607;
    --yellow: #ffbe0b;
    --blue: #3a86ff;
    --teal: #06ffa5;
    --glass: rgba(255, 255, 255, 0.2);
}

body {
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #ff006e, #8338ec);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
    overflow-x: hidden;
    touch-action: manipulation;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ===== ADDITIONS ONLY ===== */

/* GUIDE POINTER */
.guide-pointer {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 0.9rem;
    z-index: 99999;
}

.next-btn {
    position: fixed;
    bottom: 25px;
    right: 20px;
    background: linear-gradient(45deg,#ff006e,#8338ec);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 50px;
    z-index: 99999;
}

.highlight {
    box-shadow: 0 0 25px rgba(255,255,255,0.9) !important;
    transform: scale(1.03);
}

/* SECRET END */
.secret-box {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.95);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    z-index:100000;
}

/* ===== KEEP ALL YOUR ORIGINAL CSS BELOW (UNCHANGED) ===== */

/* (I KEEPING YOUR EXISTING STYLES EXACTLY — not rewriting to save space here,
BUT YOU SHOULD KEEP YOUR FULL ORIGINAL CSS FROM YOUR FILE HERE) */

</style>
</head>

<body>

<!-- ===== YOUR FULL ORIGINAL HTML (UNCHANGED) ===== -->
<!-- KEEP EVERYTHING YOU ALREADY HAVE EXACTLY AS IT IS -->

<!-- ===== ADD THESE JUST BEFORE </body> ===== -->

<!-- GUIDE UI -->
<div id="guide" class="guide-pointer">Start here 💕</div>
<button class="next-btn" onclick="nextStep()">Next ➜</button>

<!-- SECRET END -->
<div id="secretBox" class="secret-box">
    <h2>💖 My Secret For You 💖</h2>
    <p>
        I waited for you... still waiting...  
        You are not just special... you are everything to me 💕
    </p>
    <button onclick="closeSecret()">Close</button>
</div>

<script>

/* ===== KEEP ALL YOUR ORIGINAL JS (UNCHANGED) ===== */

/* ===== ADD GUIDE SYSTEM ===== */

const steps = [
    {el: '.header', text: "Start here 💕"},
    {el: '.glass-card', text: "Read this 💌"},
    {el: '.scratch-container', text: "Scratch this ✨"},
    {el: '.memory-game', text: "Play this 🧠"},
    {el: '.wheel-container', text: "Spin this 🎡"},
    {el: '.love-btn', text: "Send love 💕"}
];

let currentStep = 0;

function showStep(step){
    document.querySelectorAll('.highlight').forEach(e=>e.classList.remove('highlight'));

    const target = document.querySelector(steps[step].el);
    if(!target) return;

    target.classList.add('highlight');
    target.scrollIntoView({behavior:'smooth', block:'center'});

    document.getElementById('guide').textContent = steps[step].text;
}

function nextStep(){
    currentStep++;
    if(currentStep >= steps.length){
        unlockSecret();
        return;
    }
    showStep(currentStep);
}

setTimeout(()=>showStep(0),1000);

/* ===== AUTO PROGRESSION ===== */

function autoNext(){
    setTimeout(()=>nextStep(),800);
}

/* ===== HOOK INTO YOUR EXISTING FUNCTIONS ===== */

/* spin wheel */
const originalSpin = spinWheel;
spinWheel = function(){
    originalSpin();
    autoNext();
};

/* love button */
const originalLove = sendLove;
sendLove = function(){
    originalLove();
    autoNext();
};

/* scratch reveal */
const originalCheck = checkReveal;
checkReveal = function(){
    originalCheck();
    if (typeof scratchReveal !== "undefined" && scratchReveal === 1){
        autoNext();
    }
};

/* memory win */
const originalMatch = checkMatch;
checkMatch = function(){
    originalMatch();
    if (typeof matched !== "undefined" && matched === 4){
        autoNext();
    }
};

/* ===== SECRET SYSTEM ===== */

function unlockSecret(){
    document.getElementById('guide').textContent = "Secret unlocked 💖";
    setTimeout(()=>{
        document.getElementById('secretBox').style.display='flex';
        if(typeof confettiEffect === "function") confettiEffect();
    },1000);
}

function closeSecret(){
    document.getElementById('secretBox').style.display='none';
}

</script>

</body>
</html>
